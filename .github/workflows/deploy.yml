name: Deploy Botgame

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      command:
        description: "Comando de deploy"
        required: false
        default: update
        type: choice
        options:
          - update
          - start
          - restart
          - status

concurrency:
  group: botgame-production-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  ## Gate: nada llega a producción sin la suite headless en verde.
  quality:
    name: Quality gate
    uses: ./.github/workflows/quality.yml

  deploy:
    name: Deploy to RenaceNet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    if: github.repository == 'ExpertosTI/botgame' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Check required secrets
        run: |
          test -n "$BOTGAME_DEPLOY_HOST" || { echo "::error::Missing BOTGAME_DEPLOY_HOST"; exit 1; }
          test -n "$BOTGAME_DEPLOY_USER" || { echo "::error::Missing BOTGAME_DEPLOY_USER"; exit 1; }
          test -n "$BOTGAME_DEPLOY_SSH_KEY" || { echo "::error::Missing BOTGAME_DEPLOY_SSH_KEY"; exit 1; }
        env:
          BOTGAME_DEPLOY_HOST: ${{ secrets.BOTGAME_DEPLOY_HOST }}
          BOTGAME_DEPLOY_USER: ${{ secrets.BOTGAME_DEPLOY_USER }}
          BOTGAME_DEPLOY_SSH_KEY: ${{ secrets.BOTGAME_DEPLOY_SSH_KEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.BOTGAME_DEPLOY_HOST }}
          username: ${{ secrets.BOTGAME_DEPLOY_USER }}
          key: ${{ secrets.BOTGAME_DEPLOY_SSH_KEY }}
          port: ${{ secrets.BOTGAME_DEPLOY_PORT || 22 }}
          command_timeout: 25m
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.BOTGAME_DEPLOY_PATH || '/opt/botgame' }}"
            DEPLOY_CMD="${{ github.event.inputs.command || 'update' }}"

            echo "=== Botgame CI deploy (${DEPLOY_CMD}) ==="
            echo "Commit: ${{ github.sha }}"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Clonando repo en $APP_DIR..."
              sudo mkdir -p "$(dirname "$APP_DIR")"
              sudo git clone https://github.com/ExpertosTI/botgame.git "$APP_DIR"
            fi

            cd "$APP_DIR"
            git fetch --all --prune
            git checkout main
            git reset --hard origin/main
            chmod +x deploy.sh
            sudo ./deploy.sh "$DEPLOY_CMD"

      ## deploy.sh ya corre su propio smoke con rollback automático. Esto es la
      ## verificación externa: confirma desde fuera del VPS que la build que
      ## quedó puesta corresponde a este commit y es jugable.
      - name: Smoke externo
        if: ${{ (github.event.inputs.command || 'update') != 'status' }}
        env:
          BASE: ${{ secrets.BOTGAME_HEALTH_URL || 'https://botgame.renace.tech' }}
        run: |
          set -uo pipefail
          BASE="${BASE%/}"
          fail=0

          check() {
            local path="$1" expect="$2" label="$3" code
            for i in $(seq 1 20); do
              code=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' "${BASE}${path}" || echo 000)
              [ "$code" = "$expect" ] && { echo "ok   $label ($code)"; return 0; }
              sleep 6
            done
            echo "::error::$label devolvió HTTP $code (esperado $expect)"
            fail=1
          }

          check "/" 200 "landing"
          check "/play/index.html" 200 "juego"
          check "/play/index.wasm" 200 "wasm"
          check "/play/index.pck" 200 "pck"

          served=$(curl -sS -m 15 "${BASE}/version.json" \
            | sed -n 's/.*"build"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')
          short="$(echo "${{ github.sha }}" | cut -c1-7)"
          if [ "$served" != "$short" ]; then
            echo "::error::version.json sirve '$served' pero el commit es '$short'"
            fail=1
          else
            echo "ok   version.json = $served"
          fi

          ws=$(curl -sS -m 15 -o /dev/null -w '%{http_code}' \
            -H "Connection: Upgrade" -H "Upgrade: websocket" \
            -H "Sec-WebSocket-Version: 13" -H "Sec-WebSocket-Key: c2hha2VzcGVhcmUxMjM0" \
            "${BASE}/ws" || echo 000)
          if [ "$ws" != "101" ]; then
            echo "::error::WebSocket /ws devolvió HTTP $ws (esperado 101)"
            fail=1
          else
            echo "ok   WebSocket /ws"
          fi

          exit "$fail"
